[package]
name = "evalfence"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Fail-closed checks for declared agent benchmark metric and provenance contracts"
license = "Apache-2.0"
repository = "https://github.com/tiramitree/evalfence"
readme = "README.md"
keywords = ["agent", "benchmark", "evaluation", "provenance", "rust"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Public privacy gate
        run: python scripts/privacy_gate.py --root .
      - name: Python checks
        run: |
          python -m py_compile scripts/contextbench_audit.py scripts/swebench_manifest_audit.py scripts/statebench_boundary_audit.py scripts/privacy_gate.py scripts/verify_case_study.py scripts/verify_manifest_case_study.py scripts/verify_statebench_case_study.py tests/test_privacy_gate.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt --component clippy
          rustup default 1.97.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  cross-platform:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - run: cargo test --all-targets --locked

  contextbench-case-study:
    name: contextbench-case-study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Public privacy gate
        run: python scripts/privacy_gate.py --root .
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Install hash-pinned audit dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-audit.txt
      - name: Fetch exact ContextBench revision
        run: |
          git init build/contextbench
          git -C build/contextbench remote add origin https://github.com/EuniAI/ContextBench.git
          git -C build/contextbench fetch --depth 1 origin 1436c28a8eb95496da4ea69ad458b9f8a8eb7d61
          git -C build/contextbench checkout --detach FETCH_HEAD
      - name: Generate bounded per-instance audit cases
        run: |
          python scripts/contextbench_audit.py \
            --contextbench-root build/contextbench \
            --cases-out build/contextbench-cases.jsonl \
            --summary-out build/contextbench-summary.json
          python -c "import json; assert json.load(open('evidence/contextbench-1436c28-case-study-summary.json', encoding='utf-8')) == json.load(open('build/contextbench-summary.json', encoding='utf-8'))"
      - name: Run EvalFence and require registered findings
        run: |
          set +e
          cargo run --locked -- audit-batch \
            --input build/contextbench-cases.jsonl \
            --output build/contextbench-report.json \
            --max-examples 10 \
            --pretty
          status=$?
          set -e
          test "$status" -eq 2
      - name: Verify exact observations and violation counts
        run: |
          python scripts/verify_case_study.py \
            --summary build/contextbench-summary.json \
            --batch-report build/contextbench-report.json
      - name: Privacy-gate generated evidence
        run: |
          python scripts/privacy_gate.py --root . \
            --extra build/contextbench-cases.jsonl \
            --extra build/contextbench-summary.json \
            --extra build/contextbench-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextbench-case-study
          path: |
            build/contextbench-summary.json
            build/contextbench-report.json
          if-no-files-found: error
          retention-days: 14
